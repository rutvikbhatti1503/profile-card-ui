<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>

    <!-- Link external CSS file -->
    <link rel="stylesheet" href="style.css " />

    <!-- External font family using CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Main div for profile card -->
    <div class="profileCard">
      <!-- Profil image -->
      <img src="/Assets/profilePic.webp" alt="Rutvik profile card image" />

      <!-- Text for the profile card -->
      <div class="profileDisc">
        <!-- Name using h2 -->
        <h2>Rutvik Bhatti...</h2>

        <!-- Discription using p -->
         <p>Frontend Developer skilled in HTML, CSS, JavaScript, and React, building responsive   and user-friendly interfaces...</p>
      </div>
    </div>
  </body>
</html>
